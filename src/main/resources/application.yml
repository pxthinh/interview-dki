spring:
  application:
    name: dki-room-booking
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/roombooking}
    username: ${DB_USERNAME:roombooking}
    password: ${DB_PASSWORD:roombooking}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    web:
      pageable:
        serialization-mode: via_dto

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      # mail is best-effort (invites); an unreachable SMTP must not mark the app DOWN
      enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-change-me-32b}
    expiration: ${JWT_EXPIRATION:8h}
  seed:
    enabled: ${SEED_ENABLED:true}
  notifications:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:rooms@dki.local}
  checkin:
    enabled: ${CHECKIN_ENABLED:true}
    grace-minutes: ${CHECKIN_GRACE_MINUTES:15}
    early-window-minutes: ${CHECKIN_EARLY_WINDOW_MINUTES:5}
    sweep-interval-ms: ${CHECKIN_SWEEP_INTERVAL_MS:60000}
  google-oauth:
    enabled: ${GOOGLE_OAUTH_ENABLED:false}
    client-id: ${GOOGLE_OAUTH_CLIENT_ID:}
    client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_OAUTH_REDIRECT_URI:}
    token-key: ${GOOGLE_OAUTH_TOKEN_KEY:}
  calendar:
    enabled: ${GOOGLE_CALENDAR_ENABLED:false}
    service-account-key-path: ${GOOGLE_SERVICE_ACCOUNT_KEY_PATH:}
    invite-booker: ${GOOGLE_CALENDAR_INVITE_BOOKER:false}
    impersonate-user: ${GOOGLE_IMPERSONATE_USER:}
    poll-interval-ms: ${GOOGLE_CALENDAR_POLL_INTERVAL_MS:10000}
    import-interval-ms: ${GOOGLE_CALENDAR_IMPORT_INTERVAL_MS:30000}
    pre-sync-timeout-ms: ${GOOGLE_CALENDAR_PRESYNC_TIMEOUT_MS:2000}
    batch-size: 20
    max-attempts: 6
